name: Check Markdown Format

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_VERSION: "26.5.1"
      PRETTIER_VERSION: "3.9.6"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Collect target Markdown files
        id: files
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="$PULL_REQUEST_BASE_SHA"
          else
            BASE_SHA="${BEFORE_SHA:-}"
            if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$(git hash-object -t tree /dev/null)"
            fi
          fi

          mapfile -t CONFIG_FILES < <(
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$GITHUB_SHA" -- \
              .prettierignore \
              .prettierrc \
              .prettierrc.json \
              .prettierrc.yaml \
              .prettierrc.yml \
              prettier.config.js \
              .github/workflows/CheckMarkdownFormat.yml
          )

          if [[ ${#CONFIG_FILES[@]} -gt 0 ]]; then
            echo "Markdown check configuration changed; checking all Markdown files."
            git ls-files '*.md' '*.markdown' > /tmp/markdown_files.txt
          else
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$GITHUB_SHA" -- \
              '*.md' '*.markdown' > /tmp/markdown_files.txt
          fi

          if [[ ! -s /tmp/markdown_files.txt ]]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No Markdown files changed."
            exit 0
          fi

          echo "has_files=true" >> "$GITHUB_OUTPUT"
          echo "Target Markdown files:"
          cat /tmp/markdown_files.txt

      - name: Set up Node.js
        if: steps.files.outputs.has_files == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check Markdown formatting
        if: steps.files.outputs.has_files == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < /tmp/markdown_files.txt
          npx --yes "prettier@${PRETTIER_VERSION}" --version
          npx --yes "prettier@${PRETTIER_VERSION}" --check "${FILES[@]}"
