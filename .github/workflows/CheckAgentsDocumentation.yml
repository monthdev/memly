name: Check Agents Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check_agents_documentation:
    name: Check Agents Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check meta guide structure
        shell: bash
        run: python3 tool/agents_documentation/verify_meta_guide_structure.py "$GITHUB_WORKSPACE"

      - name: Check coding guide document
        shell: bash
        run: python3 tool/agents_documentation/verify_coding_guide_document.py "$GITHUB_WORKSPACE"
